<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/join 交回稿預覽</title>
<style>
  body { margin: 0; background: #DAD3CA; font-family: "Noto Sans TC", system-ui, sans-serif; color: #3A2E22; }
  .wrap { display: flex; gap: 56px; align-items: flex-start; padding: 56px; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .tag { display: flex; align-items: baseline; gap: 12px; }
  .tag b { background: #793A0D; color: #FCF4EC; border-radius: 6px; padding: 3px 10px; font-size: 13px; }
  .tag span { font-size: 14px; color: #5C4B3A; }
  iframe { border: 0; background: #FCF4EC; box-shadow: 0 24px 60px rgba(58, 46, 34, 0.28); display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="col">
    <div class="tag"><b>390 × 844</b><span>手機 — 首屏五元素不需捲動</span></div>
    <iframe src="join/index.html?flags=on" width="390" height="844" title="手機預覽"></iframe>
  </div>
  <div class="col">
    <div class="tag"><b>360 × 640</b><span>最窄 / 最矮 — 不破版</span></div>
    <iframe src="join/index.html?flags=on" width="360" height="640" title="窄螢幕預覽"></iframe>
  </div>
  <div class="col">
    <div class="tag"><b>1280 × 860</b><span>桌機 — 左右兩欄</span></div>
    <iframe src="join/index.html?flags=on" width="1280" height="860" title="桌機預覽"></iframe>
  </div>
</div>
</body>
</html>
