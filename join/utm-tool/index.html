<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>treehouse ｜ UTM 連結產生器</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    /* 純工具頁，不上導覽、不索引，樣式直接寫在這裡，不另開共用檔 */
    .tool { max-width: 30rem; margin: 0 auto; padding: 2.4rem var(--gutter) 3rem; }
    .tool h1 { font-size: 1.4rem; color: var(--color-brand); margin: 0 0 .3rem; }
    .tool p.hint { color: var(--color-text-soft); font-size: .92rem; margin: 0 0 1.6rem; }
    .field { margin: 0 0 1.1rem; }
    .field label { display: block; font-size: .9rem; font-weight: 600; color: var(--color-text); margin: 0 0 .35rem; }
    .field select, .field input {
      width: 100%; font: inherit; font-size: 1rem; padding: .6rem .7rem;
      border: 1px solid var(--color-border); border-radius: var(--radius-sm);
      background: var(--color-surface); color: var(--color-text);
    }
    .field select:focus, .field input:focus { outline: 3px solid var(--color-focus); outline-offset: 1px; }
    .result {
      margin-top: 1.6rem; padding: 1rem 1.1rem; background: var(--color-surface);
      border: 1px solid var(--color-border); border-radius: var(--radius);
    }
    .result__url {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: .86rem; word-break: break-all; color: var(--color-text); margin: 0 0 .8rem;
    }
    .copy-btn {
      display: inline-block; background: var(--color-brand); color: #fff; border: 0;
      border-radius: var(--radius-pill); padding: .55rem 1.3rem; font: inherit; font-weight: 600;
      cursor: pointer;
    }
    .copy-btn:hover { background: var(--color-brand-hover); }
    .copy-btn[data-copied="true"]::after { content: " ✓ 已複製"; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">跳至主要內容</a>
  <main id="main" class="tool">
    <h1>treehouse /join — UTM 連結產生器</h1>
    <p class="hint">貼上要發的貼文平台跟這篇貼文的代稱，下面自動組好完整連結，複製貼上就好，不用自己拼字串。</p>

    <div class="field">
      <label for="source">貼文平台</label>
      <select id="source">
        <option value="threads">Threads</option>
        <option value="ig">Instagram</option>
        <option value="line">LINE 官方帳號</option>
      </select>
    </div>

    <div class="field">
      <label for="content">這篇貼文的代稱（自己取，方便日後辨認即可）</label>
      <input id="content" type="text" placeholder="例如 d1_intro、veritasium_a、csb_update">
    </div>

    <div class="result">
      <p class="result__url" id="resultUrl">https://gettreehouse.app/join/?utm_source=threads&amp;utm_medium=social&amp;utm_campaign=beta_recruit_join&amp;utm_content=</p>
      <button class="copy-btn" id="copyBtn" type="button">複製連結</button>
    </div>
  </main>

  <script>
    (function () {
      "use strict";
      var BASE = "https://gettreehouse.app/join/";
      var CAMPAIGN = "beta_recruit_join";
      // 平台 -> utm_medium 對照，貼文平台已經在下拉選單裡了，不用另外選 medium
      var MEDIUM_BY_SOURCE = { threads: "social", ig: "social", line: "message" };

      var sourceEl = document.getElementById("source");
      var contentEl = document.getElementById("content");
      var resultEl = document.getElementById("resultUrl");
      var copyBtn = document.getElementById("copyBtn");

      function slugify(s) {
        return s.replace(/\s+/g, "_").replace(/[^a-zA-Z0-9_\-一-鿿]/g, "");
      }

      function buildUrl() {
        var source = sourceEl.value;
        var medium = MEDIUM_BY_SOURCE[source] || "social";
        var content = slugify(contentEl.value || "");
        var params = [
          "utm_source=" + encodeURIComponent(source),
          "utm_medium=" + encodeURIComponent(medium),
          "utm_campaign=" + encodeURIComponent(CAMPAIGN)
        ];
        if (content) params.push("utm_content=" + encodeURIComponent(content));
        return BASE + "?" + params.join("&");
      }

      function refresh() {
        resultEl.textContent = buildUrl();
        copyBtn.removeAttribute("data-copied");
      }

      sourceEl.addEventListener("change", refresh);
      contentEl.addEventListener("input", refresh);

      copyBtn.addEventListener("click", function () {
        var url = resultEl.textContent;
        function done() { copyBtn.setAttribute("data-copied", "true"); }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done).catch(function () { fallbackCopy(url, done); });
        } else {
          fallbackCopy(url, done);
        }
      });

      function fallbackCopy(text, done) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { document.execCommand("copy"); done(); } catch (e) {}
        document.body.removeChild(ta);
      }

      refresh();
    })();
  </script>
</body>
</html>
