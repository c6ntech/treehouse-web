<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="index,follow">
  <title>樹屋 Treehouse</title>
  <meta name="description" content="樹屋 Treehouse — 純文字、匿名的交友 App。隱私權政策、使用條款、刪除帳戶與常見問題。">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    /* Skeleton-only landing styling; CD (Phase B) will replace this hero. */
    .hero { text-align: center; padding: 3.5rem var(--gutter) 1rem; }
    .hero__logo { font-size: 3.2rem; line-height: 1; }
    .hero__word { font-family: var(--font-brand); color: var(--c-brand);
      font-size: 2.4rem; font-weight: 700; margin: .4rem 0 .2rem; }
    .hero__tag { color: var(--c-ink-soft); margin: 0; }
    .hub { max-width: var(--measure); margin: 1.5rem auto 0; padding: 0 var(--gutter);
      display: grid; gap: .75rem; grid-template-columns: 1fr 1fr; }
    .hub a { display: block; background: var(--c-surface); border: 1px solid var(--c-brand-weak);
      border-radius: var(--radius); padding: 1rem 1.1rem; text-decoration: none;
      color: var(--c-ink); box-shadow: var(--shadow-sm); }
    .hub a:hover { border-color: var(--c-brand); color: var(--c-brand); }
    .hub strong { display: block; color: var(--c-brand); font-size: 1.05rem; }
    .hub span { color: var(--c-ink-soft); font-size: .88rem; }
    @media (max-width: 34rem) { .hub { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-page="home">
  <a class="skip-link" href="#main">跳至主要內容</a>
  <header id="site-header"></header>

  <main id="main">
    <section class="hero">
      <div class="hero__logo" aria-hidden="true">🏠</div>
      <p class="hero__word">樹屋 Treehouse</p>
      <p class="hero__tag">純文字、匿名的交友 App</p>
    </section>

    <nav class="hub" aria-label="頁面">
      <a href="/privacy"><strong>隱私權政策</strong><span>我們如何處理你的資料</span></a>
      <a href="/terms"><strong>使用條款</strong><span>服務規範與權利義務</span></a>
      <a href="/delete-account"><strong>刪除帳戶</strong><span>如何刪除帳戶與資料</span></a>
      <a href="/faq"><strong>常見問題</strong><span>玩法、訂閱與安全</span></a>
    </nav>
  </main>

  <footer id="site-footer"></footer>
  <script src="/assets/app.js" defer></script>
</body>
</html>
